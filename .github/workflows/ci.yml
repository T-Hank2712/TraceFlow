name: TraceFlow CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
      - "chore/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  security-events: write

jobs:
  style-and-lint:
    name: Code Style and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore Control API
        working-directory: services/control-api/TraceFlow.api
        run: dotnet restore

      - name: Check Control API formatting
        working-directory: services/control-api/TraceFlow.api
        run: dotnet format TraceFlow.api.csproj --verify-no-changes --verbosity diagnostic

      - name: Check Ingestion API formatting
        working-directory: services/ingestion-api/TraceFlow.Ingestion.Api
        run: dotnet format TraceFlow.Ingestion.Api.csproj --verify-no-changes --verbosity diagnostic

      - name: Check Log Processor formatting
        working-directory: services/log-processor/TraceFlow.LogProcessor
        run: dotnet format TraceFlow.LogProcessor.csproj --verify-no-changes --verbosity diagnostic

  secret-scan:
    name: Secret and Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  control-api:
    name: Control API Build and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/control-api/TraceFlow.api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

    #   - name: Test
    #     run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage"

  ingestion-api:
    name: Ingestion API Build and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/ingestion-api/TraceFlow.Ingestion.Api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

    # - name: Test
    #   run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage"

  log-processor:
    name: Log Processor Build and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/log-processor/TraceFlow.LogProcessor

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # - name: Test
      #   run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage"

  container-build:
    name: Container Build
    runs-on: ubuntu-latest
    needs:
      - control-api
      - ingestion-api
      - log-processor

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Control API image
        run: docker build -t traceflow-control-api -f services/control-api/Dockerfile services/control-api

      - name: Build Ingestion API image
        run: docker build -t traceflow-ingestion-api -f services/ingestion-api/Dockerfile services/ingestion-api

      - name: Build Log Processor image
        run: docker build -t traceflow-log-processor -f services/log-processor/Dockerfile services/log-processor