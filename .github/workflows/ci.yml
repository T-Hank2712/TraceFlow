name: TraceFlow CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
      - "chore/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  security-events: write

jobs:
  style-and-lint:
    name: Code Style and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go for services
        uses: actions/setup-go@v5
        with:
          go-version-file: services/ingestion-api/go.mod
          cache-dependency-path: |
            services/ingestion-api/go.sum
            services/log-processor/go.sum

      - name: Check Go formatting
        run: |
          files=$(gofmt -l services/ingestion-api services/log-processor)
          if [ -n "$files" ]; then
            echo "The following Go files are not formatted:"
            echo "$files"
            exit 1
          fi

      - name: Run Go vet for Ingestion API
        working-directory: services/ingestion-api
        run: go vet ./...

      - name: Run Go vet for Log Processor
        working-directory: services/log-processor
        run: go vet ./...

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore Control API
        working-directory: services/control-api/TraceFlow.api
        run: dotnet restore

      - name: Check Control API formatting
        working-directory: services/control-api/TraceFlow.api
        run: dotnet format TraceFlow.api.csproj --verify-no-changes --verbosity diagnostic

  secret-scan:
    name: Secret and Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  control-api:
    name: Control API Build and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/control-api/TraceFlow.api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

    #   - name: Test
    #     run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage"

  ingestion-api:
    name: Ingestion API Build, Test and Coverage
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/ingestion-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/ingestion-api/go.mod
          cache-dependency-path: services/ingestion-api/go.sum

      - name: Run tests with coverage
        run: go test ./... -coverprofile=coverage.out

      - name: Show coverage summary
        run: go tool cover -func=coverage.out

      - name: Build
        run: go build ./cmd/api

  log-processor:
    name: Log Processor Build, Test and Coverage
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/log-processor

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/log-processor/go.mod
          cache-dependency-path: services/log-processor/go.sum

      - name: Run tests with coverage
        run: go test ./... -coverprofile=coverage.out

      - name: Show coverage summary
        run: go tool cover -func=coverage.out

      - name: Build
        run: go build ./cmd/worker

  container-build:
    name: Container Build
    runs-on: ubuntu-latest
    needs:
      - control-api
      - ingestion-api
      - log-processor

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Control API image
        run: docker build -t traceflow-control-api -f services/control-api/Dockerfile services/control-api

      - name: Build Ingestion API image
        run: docker build -t traceflow-ingestion-api -f services/ingestion-api/Dockerfile services/ingestion-api

      - name: Build Log Processor image
        run: docker build -t traceflow-log-processor -f services/log-processor/Dockerfile services/log-processor