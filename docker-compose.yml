services:
  postgres:
    image: postgres:16
    container_name: traceflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - traceflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  kafka:
    image: apache/kafka:4.1.2
    container_name: traceflow-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID}
      KAFKA_PROCESS_ROLES: ${KAFKA_PROCESS_ROLES}
      KAFKA_LISTENERS: ${KAFKA_LISTENERS}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}
      KAFKA_CONTROLLER_LISTENER_NAMES: ${KAFKA_CONTROLLER_LISTENER_NAMES}
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUORUM_VOTERS}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR}
    ports:
      - "${KAFKA_PORT}:9092"
    networks:
      - traceflow-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.1.2
    container_name: traceflow-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic traceflow.logs --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic traceflow.logs.dlq --partitions 1 --replication-factor 1
      "
    networks:
      - traceflow-network
  
  opensearch:
    image: opensearchproject/opensearch:3
    container_name: traceflow-opensearch
    restart: unless-stopped
    environment:
      cluster.name: ${OPENSEARCH_CLUSTER_NAME}
      node.name: ${OPENSEARCH_NODE_NAME}
      discovery.type: ${OPENSEARCH_DISCOVERY_TYPE}
      bootstrap.memory_lock: ${OPENSEARCH_BOOTSTRAP_MEMORY_LOCK}
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS}
      DISABLE_SECURITY_PLUGIN: ${OPENSEARCH_DISABLE_SECURITY_PLUGIN}
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    ports:
      - "${OPENSEARCH_PORT}:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks:
      - traceflow-network
    healthcheck:
      test: ["CMD-SHELL", "curl -k -u admin:${OPENSEARCH_INITIAL_ADMIN_PASSWORD} https://localhost:9200/_cluster/health > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  control-api:
    env_file:
      - ./.env
      - ./services/control-api/TraceFlow.api/.env
    build: 
      context: ./services/control-api
      dockerfile: Dockerfile
    container_name: traceflow-control-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5075
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
      Jwt__Secret: ${Jwt__Secret}
      Jwt__AccessTokenExpirationMinutes: ${Jwt__AccessTokenExpirationMinutes}
      Jwt__RefreshTokenExpirationDays: ${Jwt__RefreshTokenExpirationDays}
      API_KEY_PEPPER: ${API_KEY_PEPPER}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      OpenSearch__Url: ${OpenSearch__Url}
      OpenSearch__Username: ${OpenSearch__Username}
      OpenSearch__Password: ${OpenSearch__Password}
      OpenSearch__Index: ${OpenSearch__Index}
      OpenSearch__SkipTlsVerify: ${OpenSearch__SkipTlsVerify}
    ports:
      - "5075:5075"
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks:
      - traceflow-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5075/health > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ingestion-api:
    env_file:
      - ./services/ingestion-api/TraceFlow.Ingestion.Api/.env
    build:
      context: ./services/ingestion-api
      dockerfile: Dockerfile
    container_name: traceflow-ingestion-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5100
      CONTROL_API_BASE_URL: ${CONTROL_API_BASE_URL}
      VALIDATE_API_URL: ${VALIDATE_API_URL}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      CONTROL_API_TIMEOUT_SECONDS: ${CONTROL_API_TIMEOUT_SECONDS}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      MAX_BATCH_SIZE: ${MAX_BATCH_SIZE}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES}
    ports:
      - "5100:5100"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      control-api:
        condition: service_healthy
    networks:
      - traceflow-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5100/health > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  
  log-processor:
    env_file:
      - ./services/log-processor/TraceFlow.LogProcessor/.env
    build: 
      context: ./services/log-processor
      dockerfile: Dockerfile
    container_name: traceflow-log-processor
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP}
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC}
      KAFKA_POLL_TIMEOUT_MS: ${KAFKA_POLL_TIMEOUT_MS}
      PROCESSOR_MAX_RETRIES: ${PROCESSOR_MAX_RETRIES}
      PROCESSOR_RETRY_BACKOFF_MS: ${PROCESSOR_RETRY_BACKOFF_MS}
      PROCESSOR_BATCH_SIZE: ${PROCESSOR_BATCH_SIZE}
      PROCESSOR_FLUSH_INTERVAL_MS: ${PROCESSOR_FLUSH_INTERVAL_MS}
      OPENSEARCH_URL: ${OPENSEARCH_URL}
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD}
      OPENSEARCH_INDEX: ${OPENSEARCH_INDEX}
      OPENSEARCH_SKIP_TLS_VERIFY: ${OPENSEARCH_SKIP_TLS_VERIFY}
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy
    networks:
      - traceflow-network

volumes:
    postgres_data:
      name: traceflow-postgres-data
    opensearch_data:
      name: traceflow-opensearch-data

networks:
    traceflow-network:
      name: traceflow-network
      driver: bridge