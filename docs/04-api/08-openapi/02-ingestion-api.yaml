openapi: 3.1.0
info:
  title: TraceFlow Ingestion API
  version: 1.0.0
  description: |
    Public ingestion contract. A successful response confirms Kafka delivery acknowledgement,
    not OpenSearch indexing. Every write request requires a stable Idempotency-Key.
paths:
  /v1/logs:
    post:
      summary: Ingest one structured log event
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogRequest'
      responses:
        '200':
          description: Kafka acknowledged the event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestLogResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The Idempotency-Key was previously used with a different payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Kafka delivery or idempotency storage could not be confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/batch-logs:
    post:
      summary: Ingest a batch of structured log events
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [logs]
              properties:
                logs:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/LogRequest'
      responses:
        '200':
          description: Valid items were acknowledged by Kafka; invalid items are reported per item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchLogResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The Idempotency-Key was previously used with a different payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: One or more Kafka deliveries could not be confirmed; per-item results are retained.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchLogResponse'
components:
  parameters:
    ApiKey:
      name: Authorization
      in: header
      required: true
      schema:
        type: string
      example: ApiKey tfk_live_...
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Reuse the same value and payload when retrying. Maximum 128 characters.
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    BadRequest:
      description: Invalid request payload or missing/invalid Idempotency-Key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, malformed, revoked, expired, or invalid API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Pre-auth or authenticated rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    LogRequest:
      type: object
      required: [level, service, message]
      properties:
        timestamp:
          type: [string, 'null']
          format: date-time
        level:
          type: integer
          minimum: 0
          maximum: 5
          description: Microsoft.Extensions.Logging.LogLevel from Trace (0) to Critical (5).
        service:
          type: string
        message:
          type: string
        traceId:
          type: [string, 'null']
        correlationId:
          type: [string, 'null']
        metadata:
          type: [object, 'null']
          additionalProperties: true
    IngestLogResponse:
      type: object
      required: [eventId, status, acceptedAt]
      properties:
        eventId:
          type: string
        status:
          type: boolean
          example: true
        acceptedAt:
          type: string
          format: date-time
    BatchLogResponse:
      type: object
      required: [batchId, total, accepted, rejected, results]
      properties:
        batchId:
          type: string
        total:
          type: integer
        accepted:
          type: integer
        rejected:
          type: integer
        results:
          type: array
          items:
            type: object
            required: [index, accepted]
            properties:
              index:
                type: integer
              accepted:
                type: boolean
              eventId:
                type: [string, 'null']
              error:
                type: [string, 'null']
        error:
          $ref: '#/components/schemas/ErrorResponse'
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: [object, 'null']
          additionalProperties:
            type: array
            items:
              type: string
